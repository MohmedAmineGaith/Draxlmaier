<app-navbar></app-navbar>

<div class="dashboard-container">
  <div class="page-header">
     <div class="header-content">
      <div class="title-section">
        <div class="icon-wrapper">
          <i class="bi bi-people-fill"></i>
        </div>
        <div>
          <h3 class="page-title">Liste des Visiteurs</h3>
        </div>
      </div>
      
     </div>
   </div>

    <p *ngIf="loading" class="text-muted px-3">Chargement des statistiques...</p>

    <div class="row" *ngIf="!loading">
      <div class="col-md-3 mb-3" *ngFor="let card of cards">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <div class="mb-2" *ngIf="card.icon === 'sigma'">
                <span class="fa-2x" [style.color]="card.color" style="font-weight: bold;">&#x03A3;</span>
              </div>
            <div class="mb-2">
              <i [class]="card.icon + ' fa-2x'" [style.color]="card.color"></i>
            </div>
            <h5>{{ card.value }}</h5>
            <p class="mb-1">{{ card.label }}</p>
            
            <a [routerLink]="card.link" class="text-primary small">{{ card.linkLabel }}</a>
          </div>
        </div>
      </div>
    </div>
</div>
