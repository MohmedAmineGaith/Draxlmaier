<!-- HERO -->
<section class="hero">

<!-- FORM -->
<main class="form-wrapper">
  <form class="visit-form" id="visitForm" novalidate>
    <div class="form-header">
      <span class="form-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 19c1.5-3 4-4.5 6.5-4.5S17 16 18.5 19" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      <h2>Informations du Visiteur</h2>
    </div>
    <div class="form-divider"></div>

    <div class="form-grid">
      <div class="field">
        <label for="nom">Nom &amp; Prénom <span class="req">*</span></label>
        <input id="nom" name="nom" type="text" placeholder="Entrez votre nom et prénom" required />
      </div>
      <div class="field">
        <label for="societe">Société <span class="req">*</span></label>
        <input id="societe" name="societe" type="text" placeholder="Entrez le nom de votre société" required />
      </div>
      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" placeholder="Entrez votre email" required />
      </div>

      <div class="field">
        <label for="tel">Num TEL <span class="req">*</span></label>
        <input id="tel" name="tel" type="tel" placeholder="Entrez votre numéro de téléphone" required />
      </div>
      <div class="field">
        <label for="localisation">Localisation <span class="req">*</span></label>
        <input id="localisation" name="localisation" type="text" placeholder="Ex: Siège Sousse" required />
      </div>
      <div class="field">
        <label for="date">Date de visite <span class="req">*</span></label>
        <input id="date" name="date" type="date" required />
      </div>

      <div class="field">
        <label for="type">Type de personne <span class="req">*</span></label>
        <div class="select-wrap">
          <select id="type" name="type" required>
            <option>RH</option>
            <option>Client</option>
            <option>Fournisseur</option>
            <option>Prestataire</option>
            <option>Autre</option>
          </select>
          <svg class="select-caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="field">
        <label for="motif">Motif De Visite <span class="req">*</span></label>
        <div class="select-wrap">
          <select id="motif" name="motif" required>
            <option>Réunion</option>
            <option>Entretien</option>
            <option>Audit</option>
            <option>Formation</option>
            <option>Livraison</option>
          </select>
          <svg class="select-caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="field">
        <label for="responsable">Diriger cette visite vers <span class="req">*</span></label>
        <input id="responsable" name="responsable" type="text" placeholder="Nom du responsable" required />
      </div>

      <div class="field field-full">
        <label for="but">But de la visite <span class="req">*</span></label>
        <textarea id="but" name="but" rows="4" placeholder="Décrire le but de la visite" required></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2.5 12L21.5 3.5 18 21l-6.5-6L18 6 9 13.5 2.5 12z"/></svg>
        SOUMETTRE LA DEMANDE
      </button>
    </div>
  </form>
</main>
